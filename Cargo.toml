[package]
name = "mindtask"
version = "0.9.0"
edition = "2024"
description = "A CLI tool combining mindmaps with task dependency graphs"
license = "GPL-3.0-only"
authors = ["Dan Probst <dan@probst.dev>"]
readme = "README.md"
repository = "https://git.sr.ht/~danprobst/mindtask"
keywords = ["cli", "mindmap", "task", "dag", "planning"]
categories = ["command-line-utilities"]
exclude = ["docs/", "STATUS.md", "CODE_REVIEW.md", "justfile", "tests/fixtures/", "claude_skill/", "tests/skill_doc_sync.rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
petgraph = "0.8"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
anyhow = "1"
termtree = "1.0.0"
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"
