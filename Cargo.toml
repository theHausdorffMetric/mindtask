[package]
name = "mindtask"
version = "0.1.0"
edition = "2024"
description = "A CLI tool combining mindmaps with task dependency graphs"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
petgraph = "0.7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
